services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartinsights-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartinsights
      POSTGRES_PASSWORD: smartinsights
      POSTGRES_DB: smartinsights
    ports:
      - "5433:5432"
    volumes:
      - smartinsights_pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartinsights -d smartinsights"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartinsights_pgdata:
